<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="100%" height="100%">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group Logo Circle Icon -->
  <g transform="translate(10, 5)">
    <!-- Outer Stethoscope Ring -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#greenGrad)" stroke-width="6" filter="url(#greenGlow)"/>
    <circle cx="50" cy="50" r="37" fill="#062319" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
    
    <!-- Medical Heartbeat & Silhouette -->
    <!-- Head -->
    <circle cx="50" cy="33" r="8" fill="#34d399"/>
    <!-- Shoulders / Body -->
    <path d="M 33 58 C 33 46, 67 46, 67 58 C 67 62, 33 62, 33 58 Z" fill="#10b981"/>
    <!-- Stethoscope chest piece wrapping silhouette -->
    <path d="M 32 38 C 24 45, 24 60, 35 68 C 45 75, 55 75, 65 68 C 76 60, 76 45, 68 38" fill="none" stroke="#6ee7b7" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Small Earpieces -->
    <circle cx="32" cy="36" r="2.5" fill="#6ee7b7"/>
    <circle cx="68" cy="36" r="2.5" fill="#6ee7b7"/>
    <!-- Plus Cross Icon inside chest -->
    <path d="M 50 44 L 50 56 M 44 50 L 56 50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography Text -->
  <!-- CLINIQUE -->
  <text x="115" y="48" font-family="'Outfit', 'Inter', sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="2.5">
    CLINIQUE
  </text>
  <!-- TOUNKARA -->
  <text x="115" y="85" font-family="'Outfit', 'Inter', sans-serif" font-size="38" font-weight="900" fill="url(#greenGrad)" letter-spacing="3" filter="url(#greenGlow)">
    TOUNKARA
  </text>
  <!-- Subtitle / Tagline -->
  <text x="115" y="103" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a7f3d0" letter-spacing="3.5">
    KEUR MASSAR — SÉNÉGAL (24H/24)
  </text>
</svg>
