{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Connexion — PharmaTounkara | Clinique Tounkara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', system-ui, sans-serif; }

        :root {
            --bg-main: #05130d;
            --bg-card: rgba(11, 34, 23, 0.92);
            --bg-input: #112d20;
            --border-color: rgba(16, 185, 129, 0.25);
            --color-primary: #10b981;
            --color-primary-hover: #059669;
            --color-teal-bright: #34d399;
            --color-success: #10b981;
            --color-danger: #ef4444;
            --text-primary: #ffffff;
            --text-secondary: #e2e8f0;
            --text-muted: #6ee7b7;
        }

        html, body {
            height: 100%;
            background: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* Animated background */
        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.22;
            animation: float 12s ease-in-out infinite;
        }
        .orb-1 { width: 500px; height: 500px; background: #10b981; top: -15%; left: -10%; animation-delay: 0s; }
        .orb-2 { width: 350px; height: 350px; background: #34d399; bottom: -10%; right: 5%; animation-delay: -4s; }
        .orb-3 { width: 250px; height: 250px; background: #059669; top: 40%; left: 55%; animation-delay: -8s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        /* Main container */
        .login-container {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem 2.25rem;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 25px rgba(13,148,136,0.15);
            animation: slideUp 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo / header */
        .login-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .login-title {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            text-align: center;
        }
        .login-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 1.15rem;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.45rem;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 0.95rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
            transition: color 0.2s;
        }
        .input-wrap input {
            width: 100%;
            padding: 0.78rem 1rem 0.78rem 2.6rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.92rem;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrap input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(13,148,136,0.2);
        }
        .input-wrap input:focus + i,
        .input-wrap:focus-within i {
            color: var(--color-primary);
        }

        /* Toggle password eye */
        .toggle-eye {
            position: absolute;
            right: 0.95rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0;
            transition: color 0.2s;
        }
        .toggle-eye:hover { color: var(--color-primary); }

        /* Error message */
        .error-msg {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 8px;
            padding: 0.65rem 0.9rem;
            font-size: 0.82rem;
            color: #fca5a5;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.15rem;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Login button */
        .btn-login {
            width: 100%;
            padding: 0.88rem 1rem;
            background: linear-gradient(135deg, #0d9488, #06b6d4);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            transition: all 0.22s ease;
            box-shadow: 0 4px 18px rgba(13,148,136,0.4);
            margin-top: 0.4rem;
            letter-spacing: 0.03em;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(13,148,136,0.6);
        }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer */
        .login-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.76rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            line-height: 1.5;
        }
        .login-footer a { color: var(--color-teal-bright); text-decoration: none; font-weight: 600; }
        .login-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <!-- Background animated orbs -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="login-container">
        <div class="login-card">

            <!-- Logo Officiel Clinique Tounkara -->
            <div class="login-logo">
                <img src="{% static 'images/logo_clinique_tounkara.svg' %}" alt="Clinique Tounkara Logo" style="width: 280px; height: auto; filter: drop-shadow(0 0 12px rgba(13,148,136,0.4));">
            </div>

            <div class="login-title">Espace Pharmacie</div>
            <div class="login-subtitle">Connectez-vous pour accéder au logiciel de gestion</div>

            <!-- Error message -->
            {% if error %}
            <div class="error-msg">
                <i class="fa-solid fa-triangle-exclamation"></i>
                {{ error }}
            </div>
            {% endif %}

            <!-- Login form -->
            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Identifiant</label>
                    <div class="input-wrap">
                        <input type="text" id="username" name="username" placeholder="Identifiant (ex: admin, caissier...)" required autocomplete="username" value="{{ username|default:'' }}">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" placeholder="Mot de passe" required autocomplete="current-password">
                        <i class="fa-solid fa-lock"></i>
                        <button type="button" class="toggle-eye" onclick="togglePwd()" title="Afficher/masquer">
                            <i class="fa-solid fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="login-btn">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Connexion Pharmacie
                </button>
            </form>

            <div class="login-footer">
                <strong>CLINIQUE TOUNKARA</strong> — Service Pharmacie & Gestion<br>
                <i class="fa-solid fa-location-dot" style="color: var(--color-primary);"></i> Keur Massar, Dakar · <i class="fa-solid fa-phone" style="color: var(--color-primary);"></i> +221 77 478 43 43<br>
                <a href="https://www.clinictounkara.com/" target="_blank">www.clinictounkara.com</a>
            </div>
        </div>
    </div>

    <script>
        function togglePwd() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        // Auto-focus
        document.getElementById('username').focus();

        // Disable button on submit to avoid double-click
        document.querySelector('form').addEventListener('submit', function() {
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connexion en cours...';
        });
    </script>
</body>
</html>
